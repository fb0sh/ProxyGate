# ProxyGate configuration.
#
# Every key is optional: with no config file at all, the server starts
# with an empty pool on 127.0.0.1:8080 (proxy) and 127.0.0.1:8081 (API).
#
# Durations accept `30s`, `10m`, `2h`, `1d`, `250ms`, `1h30m` or plain seconds.

server:
  # Address of the HTTP proxy gateway. Keep it on the loopback address unless
  # you really mean to expose it: clients are not asked for credentials by
  # default, so anyone who can reach this port can use your pool. See the
  # "Security" section of README.md before changing this.
  proxy: 127.0.0.1:8080
  # Address of the REST API. `same` serves it on the proxy port: a proxy request
  # is a CONNECT or an absolute-form target, an API call is `/api/v1/...`, so one
  # listener can tell them apart. Client authentication applies to proxy requests
  # only, so sharing the port leaves the API open.
  api: 127.0.0.1:8081
  # api: same

# Where proxies come from.
#
# Four kinds of subscriber:
#
#   http   one URL, the payload parsed by `format`
#   file   a local file, same formats
#   exec   run a command, read proxy URLs from its stdout
#   lua    run a Lua script; every line it `print`s is a candidate proxy
#
# `lua` is the general one: it can fetch, page through an API, sign a request
# and reshape a response, so a source that needs custom logic no longer needs a
# ProxyGate release. The full script API (`fetch`, `fetch_json`,
# `json_encode`, `json_decode`, `log`, `print`, and the sandbox rules) is
# documented in `GET /help` and in README.md.
#
# Everything below is free/public: expect most of what these return to fail the
# health check (dead endpoints, and proxies that intercept TLS with their own
# certificate — ProxyGate refuses those), and expect rate limits, so leave
# `refresh.interval` at 10m or slower.

subscribers:
  # A small, fast JSON API. The built-in JSON reader already understands the
  # envelope (`{"data":{"proxies":[...]}}`), so a script would add nothing.
  - name: scdn
    type: http
    url: https://proxy.scdn.io/api/get_proxy.php?protocol=http&count=20
    format: json

  # ~120 entries, all HTTP, with country/region/anonymity per entry.
  - name: freeproxy-cn
    type: http
    url: https://www.freeproxy.com.cn/proxy.json
    format: json

  # ~5,000 entries paginated 500 at a time. Written as Lua so that all ten
  # pages arrive as one subscriber (the page count is read from the API's own
  # `pagination.totalPages`), and so socks4-only entries are dropped instead of
  # being handed out as HTTP proxies that cannot connect.
  #
  # `url` and `page_size` are not ProxyGate keys: unknown keys become globals
  # in the script, which is how a script gets its parameters.
  - name: rola-ip
    type: lua
    url: https://rola-ip.co/proxy-api/api/v1/proxies
    page_size: 500
    timeout: 60s
    lua_code: |
      local page, pages = 1, 1
      repeat
        local body = fetch_json(url .. "?page=" .. page .. "&pageSize=" .. page_size)
        pages = (body.pagination and body.pagination.totalPages) or 1
        for _, item in ipairs(body.data or {}) do
          local scheme = nil
          for _, protocol in ipairs(item.protocols or {}) do
            local name = string.lower(protocol)
            if name == "http" or name == "https" then
              scheme = "http"
              break
            elseif name == "socks5" then
              scheme = "socks5h"
            end
          end
          if scheme then
            print(scheme .. "://" .. item.ip .. ":" .. item.port)
          end
        end
        page = page + 1
      until page > pages

  # ~16k entries, 2.5 MB, ordered fastest-first, so the head of the list is the
  # useful end. `limit` keeps the pool small enough that a health pass takes
  # tens of seconds instead of minutes; set it to 0 to keep everything.
  - name: freeproxy-gh
    type: http
    url: https://charlespikachu.github.io/freeproxy/proxies.json
    format: json
    timeout: 300s
    limit: 1000

  # Your own sources, with every key spelled out:
  #
  # - name: provider-a
  #   type: http
  #   url: https://example.com/proxies.txt
  #   format: plaintext          # plaintext (default) | json | clash
  #   timeout: 20s
  #   limit: 200                 # keep at most this many (0 = no cap)
  #   headers:                   # for endpoints that need a token
  #     Authorization: Bearer <token>
  #
  # - name: local
  #   type: file
  #   path: ./proxies.txt
  #   format: plaintext
  #
  # - name: custom
  #   type: exec
  #   command:
  #     - python3
  #     - ./subscribers/example.py
  #     - --url
  #     - https://example.com/weird-api
  #   format: plaintext
  #   timeout: 30s
  #   env:
  #     API_TOKEN: "..."
  #
  # - name: my_scraper
  #   type: lua
  #   target_url: https://api.example.com/data.json   # extra keys -> globals
  #   limit: 500
  #   lua_code: |
  #     local data = fetch_json(target_url)
  #     for _, item in ipairs(data.items or {}) do
  #       print(item.ip .. ":" .. item.port)
  #     end

refresh:
  # How long a fetched subscriber result is reused before fetching again.
  interval: 10m
  # Per-subscriber timeout.
  timeout: 20s

health:
  # Every target is fetched *through each proxy*, concurrently. A proxy is only
  # usable if the probe succeeds, so these are the questions you are asking:
  # one international endpoint (proves the tunnel actually leaves the country)
  # and one domestic one (proves it is not simply broken for everything else).
  #
  # `require: any` (default) accepts a proxy that reaches at least one of them,
  # which keeps the pool usable on networks where one target is hard to reach.
  # Switch to `all` to hand out only proxies that reach everything you need.
  targets:
    - https://www.google.com/generate_204
    - https://cn.bing.com/
  require: any

  # Cheaper/faster alternatives if Google is a poor fit for you:
  #   - https://cp.cloudflare.com/generate_204      (global anycast, 204)
  #   - http://connect.rom.miui.com/generate_204    (domestic, very fast)
  # `target: <url>` (singular) is still accepted as an alias for a one-entry list.
  # How long a health result is reused before probing again. Also the window
  # that keeps a burst of `/api/v1/get` calls from re-probing the whole pool.
  interval: 30s
  # Per-proxy request timeout.
  timeout: 5s
  # Maximum number of proxies probed at the same time.
  concurrency: 100
  # Consecutive failures after which a proxy that was working is considered
  # dead. A proxy that never answered is dead after its first failure.
  max_failures: 3

selection:
  # random (spread the load) or latency (prefer the fastest probe).
  strategy: random
  # Prefer proxies that were not handed out within this window.
  reuse_after: 30m
  # Probe the chosen proxy before handing it out, so `/api/v1/get` returns one
  # that just passed instead of one whose verdict may be hours old.
  verify: true
  # Skip that probe when the cached verdict is newer than this. `0s` probes
  # every time (the safest and, in a one-client setup, perfectly affordable).
  max_age: 60s
  # Timeout for probing a single candidate while handing out. Shorter than
  # `health.timeout` on purpose: better to try the next candidate quickly.
  verify_timeout: 3s
  # Candidates to try when a verification fails before giving up.
  verify_attempts: 3

gateway:
  # Extra upstream attempts after the first one fails. CONNECT tunnels retry any
  # failure; plain HTTP only retries GET and HEAD.
  retries: 2
  # Timeout for connecting to an upstream and completing the CONNECT handshake.
  connect_timeout: 10s
  # No client authentication: this file assumes the gateway stays reachable only
  # from this machine. Set `auth: user:password` to require credentials from
  # gateway clients — note that the REST API stays open either way when
  # `server.api` shares the proxy port.

state:
  # Where state.json and cache.json live.
  # Default: $PROXYGATE_CACHE_DIR, else ~/.cache/proxygate
  # dir: /var/lib/proxygate
