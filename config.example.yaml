# ProxyGate configuration.
#
# Every key is optional: with no config file at all, the server starts with an
# empty pool on 127.0.0.1:8080. Durations accept `30s`, `10m`, `2h`, `1d`,
# `250ms`, `1h30m` or plain seconds.

server:
  # The one port ProxyGate listens on: the HTTP proxy gateway and the REST API
  # share it. They never collide because the request shapes differ — a proxy
  # request is `CONNECT host:port` or an absolute-form `GET http://host/path`,
  # an API call is an origin-form `/api/v1/...`.
  #
  # `gateway.auth` below protects proxy requests only, so the API on this port
  # stays open. Keep it on the loopback address unless you mean to expose the
  # pool itself.
  listen: 127.0.0.1:8080
  # listen: 0.0.0.0:8080

subscribers:
  # A subscriber is a Lua script. It fetches whatever it wants and **returns** a
  # list of proxy tables — one table per proxy:
  #
  #   { type = "http" | "socks5" | "socks5h", ip = "1.2.3.4", port = 8080, auth = "user:pass" }
  #
  # `auth` is optional. `type = "socks4"` (or anything unknown) is dropped, and
  # `socks5` becomes `socks5h` so the proxy resolves names — with poisoned local
  # DNS a locally resolved address would be handed to the proxy as-is.
  #
  # Inside the script:
  #
  #   fetch(url)        one GET, returns the body as a string; raises on non-2xx
  #   fetch_json(url)   same, decoded into a Lua table
  #   json_encode(v) / json_decode(s)
  #   log(...)          writes to ProxyGate's log; `print` is an alias for it
  #
  # The sandbox loads only string/table/math/coroutine: `io`, `os`, `package`
  # and `debug` are absent, and `dofile`/`loadfile`/`load`/`require` are removed,
  # so `fetch` is the only way out. `timeout` bounds the whole script, including
  # `while true do end`. Every refresh builds a fresh Lua state.
  #
  # Any key that is not `name`/`script_name`, `lua_code`, `lua_file`, `timeout`,
  # `limit` or `enabled` becomes a global in the script — that is how a script
  # gets its parameters. `lua_code` and `lua_file` are mutually exclusive.

  # ~5,000 proxies, 500 per page. The page count comes from the API's own
  # `pagination.totalPages`, so a growing list needs no config change.
  #
  # `limit: 1000` keeps a fifth of it. Free proxies die at a brutal rate — one
  # measured pool of 1,020 had 13 working — so probing 5,000 of them mostly buys
  # five times the waiting, not five times the usable proxies. The health pass is
  # the bottleneck here, not the script.
  - name: rola-ip
    timeout: 60s
    limit: 1000
    lua_code: |
      local page, pages = 1, 1
      local result = {}
      repeat
        local body = fetch_json("https://rola-ip.co/proxy-api/api/v1/proxies?page=" .. page .. "&pageSize=500")
        pages = (body.pagination and body.pagination.totalPages) or 1
        for _, item in ipairs(body.data or {}) do
          local scheme = nil
          for _, protocol in ipairs(item.protocols or {}) do
            local name = string.lower(protocol)
            if name == "http" or name == "https" then
              scheme = "http"
              break
            elseif name == "socks5" then
              scheme = "socks5h"
            end
          end
          if scheme then
            table.insert(result, {
              type = scheme,
              ip = item.ip,
              port = item.port,
              auth = item.auth or ""
            })
          end
        end
        page = page + 1
      until page > pages
      return result

  # A small, fast JSON API. The interesting bits of this one: the proxies sit
  # under `data.proxies`, the payload carries no protocol (so these are HTTP
  # proxies), and the endpoint caps `count` itself.
  - name: scdn
    timeout: 20s
    lua_code: |
      local body = fetch_json("https://proxy.scdn.io/api/get_proxy.php?protocol=http&count=20")
      local result = {}
      for _, entry in ipairs(body.data.proxies or {}) do
        local host, port = entry:match("^(.+):(%d+)$")
        if host then
          table.insert(result, { type = "http", ip = host, port = tonumber(port), auth = "" })
        end
      end
      return result

  # A local list, read by the script itself: a proxy file is just another thing
  # a script can be pointed at while testing.
  # - name: local
  #   lua_file: ./scripts/local.lua

  # Anything else: a script in its own file, with the endpoint injected as a
  # global instead of hard-coded.
  # - name: my_scraper
  #   timeout: 30s
  #   target_url: https://api.example.com/data.json
  #   token: "..."                       # extra keys -> globals
  #   limit: 500                         # keep at most this many (0 = no cap)
  #   lua_file: ./scripts/my_scraper.lua

refresh:
  # How long a fetched subscriber result is reused before running the script
  # again — i.e. how often new proxies are pulled in.
  interval: 10m
  # Per-subscriber timeout, when the subscriber does not set its own.
  timeout: 20s

health:
  # Every target is fetched *through each proxy*, concurrently. A proxy is only
  # usable if the probe succeeds, so these are the questions you are asking:
  # one international endpoint (proves the tunnel actually leaves the country)
  # and one domestic one (proves it is not simply broken for everything else).
  #
  # `require: any` (default) accepts a proxy that reaches at least one of them,
  # which keeps the pool usable on networks where one target is hard to reach.
  # Switch to `all` to hand out only proxies that reach everything you need.
  targets:
    - https://www.google.com/generate_204
    - https://cn.bing.com/
  require: any

  # Cheaper/faster alternatives if Google is a poor fit for you:
  #   - https://cp.cloudflare.com/generate_204      (global anycast, 204)
  #   - http://connect.rom.miui.com/generate_204    (domestic, very fast)
  # `target: <url>` (singular) is still accepted as an alias for a one-entry list.
  #
  # NOT the same knob as `refresh.interval`: that one decides how often the
  # subscriber scripts run and pull in new proxies, this one decides how often
  # the *existing* pool is probed again. Re-probing several thousand proxies
  # every 30s is too often, and the log fills with TLS errors; 5m is a good
  # middle ground between noticing a proxy that just died and doing nothing.
  interval: 5m
  # Per-proxy request timeout. Free proxies are mostly dead connections, and 3s
  # is enough to tell; waiting 5s only makes the whole pass slower.
  timeout: 3s
  # Maximum number of proxies probed at the same time — the single knob that
  # decides how long the first check takes. On a measured 1,020-proxy pool
  # against the real targets, 300 in flight finished in 14s and 100 in 30s (the
  # gap depends on how quickly dead proxies fail, not only on the parallelism).
  # A source that returns tens of thousands of entries should get a `limit` for
  # the same reason.
  concurrency: 300
  # Consecutive failures after which a proxy that was working is considered
  # dead. A proxy that never answered is dead after its first failure.
  max_failures: 3

selection:
  # random (spread the load) or latency (prefer the fastest probe).
  strategy: random
  # Prefer proxies that were not handed out within this window.
  reuse_after: 30m
  # Probe the chosen proxy before handing it out, so `/api/v1/get` returns one
  # that just passed instead of one whose verdict may be hours old.
  verify: true
  # Skip that probe when the cached verdict is newer than this. `0s` probes
  # every time (the safest and, in a one-client setup, perfectly affordable).
  max_age: 60s
  # Timeout for probing a single candidate while handing out. Shorter than
  # `health.timeout` on purpose: better to try the next candidate quickly.
  verify_timeout: 3s
  # Candidates to try when a verification fails before giving up.
  verify_attempts: 3

gateway:
  # Extra upstream attempts after the first one fails. CONNECT tunnels retry any
  # failure; plain HTTP only retries GET and HEAD.
  retries: 2
  # Timeout for connecting to an upstream and completing the CONNECT handshake.
  connect_timeout: 10s
  # No client authentication: this file assumes the gateway stays reachable only
  # from this machine. Set `auth: user:password` to require credentials from
  # gateway clients — the REST API on the same port stays open either way,
  # because it is not a proxy request.

state:
  # Where state.json and cache.json live.
  # Default: $PROXYGATE_CACHE_DIR, else ~/.cache/proxygate
  # dir: /var/lib/proxygate
