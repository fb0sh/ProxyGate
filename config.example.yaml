# ProxyGate configuration.
#
# Every key is optional: with no config file at all, `proxygate serve` starts
# with an empty pool on 127.0.0.1:8080 (proxy) and 127.0.0.1:8081 (API).
#
# Durations accept `30s`, `10m`, `2h`, `1d`, `250ms`, `1h30m` or plain seconds.

server:
  # Address of the HTTP proxy gateway. Keep it on the loopback address unless
  # you really mean to expose it (and set `gateway.auth` if you do).
  proxy: 127.0.0.1:8080
  # Address of the REST API.
  api: 127.0.0.1:8081

# Where proxies come from. Three kinds: http, file, exec.
subscribers:
  # A real provider: https://proxy.scdn.io/api_docs.php
  # It answers with a JSON envelope — {"code":200,"data":{"proxies":["1.2.3.4:8080"]}}
  # — which the built-in `json` format walks for you.
  #
  # The payload is plain `host:port` with no scheme, so ProxyGate reads each
  # entry as an HTTP proxy; ask for `protocol=http` to match. `count` is capped
  # at 20 by the provider, and `&country_code=CN` narrows it down by country.
  # For socks4/socks5 entries, wrap this in an `exec` subscriber that prefixes
  # the scheme (see subscribers/README.md) — the API does not tell you which of
  # its returned endpoints is which protocol.
  #
  # Expect most entries to fail the health check: free lists are mostly dead
  # endpoints, and a good share of the HTTPS-capable ones intercept TLS with a
  # certificate signed by themselves, which ProxyGate refuses to use. Filtering
  # exactly that is the checker's job.
  #
  # It rate limits: the default `refresh.interval` of 10m is fine, a 30s one is not.
  - name: scdn
    type: http
    url: https://proxy.scdn.io/api/get_proxy.php?protocol=http&count=20
    format: json
    timeout: 20s

  # A plain URL: one proxy per line, `#` starts a comment.
  - name: provider-a
    type: http
    url: https://example.com/proxies.txt

  # The same endpoint with a different payload format.
  # `format` is one of plaintext (default), json, clash.
  - name: provider-b
    type: http
    url: https://example.com/sub.yaml
    format: clash
    timeout: 20s
    # Extra request headers, e.g. for an API token.
    # headers:
    #   Authorization: Bearer <token>

  # A local file.
  - name: local
    type: file
    path: ./proxies.txt
    format: plaintext

  # The escape hatch: run a command and read proxy URLs from its stdout.
  # Whatever the provider's format is (HTML, base64, protobuf, a signed API),
  # the script does the parsing and ProxyGate stays simple.
  # See subscribers/README.md for the contract.
  - name: custom
    type: exec
    command:
      - python3
      - ./subscribers/example.py
      - --url
      - https://example.com/weird-api
    format: plaintext
    timeout: 30s
    # env:
    #   API_TOKEN: "..."

refresh:
  # How long a fetched subscriber result is reused before fetching again.
  interval: 10m
  # Per-subscriber timeout.
  timeout: 20s

health:
  # Every target is fetched *through each proxy*, concurrently. A proxy is only
  # usable if the probe succeeds, so these are the questions you are asking:
  # one international endpoint (proves the tunnel actually leaves the country)
  # and one domestic one (proves it is not simply broken for everything else).
  #
  # `require: any` (default) accepts a proxy that reaches at least one of them,
  # which keeps the pool usable on networks where one target is hard to reach.
  # Switch to `all` to hand out only proxies that reach everything you need.
  targets:
    - https://www.google.com/generate_204
    - https://cn.bing.com/
  require: any

  # Cheaper/faster alternatives if Google is a poor fit for you:
  #   - https://cp.cloudflare.com/generate_204      (global anycast, 204)
  #   - http://connect.rom.miui.com/generate_204    (domestic, very fast)
  # `target: <url>` (singular) is still accepted as an alias for a one-entry list.
  # How long a health result is reused before probing again. Also the window
  # that keeps a burst of `proxygate get` calls from re-probing the whole pool.
  interval: 30s
  # Per-proxy request timeout.
  timeout: 5s
  # Maximum number of proxies probed at the same time.
  concurrency: 100
  # Consecutive failures after which a proxy that was working is considered
  # dead. A proxy that never answered is dead after its first failure.
  max_failures: 3

selection:
  # random (spread the load) or latency (prefer the fastest probe).
  strategy: random
  # Prefer proxies that were not handed out within this window.
  reuse_after: 30m

gateway:
  # Extra upstream attempts after the first one fails. CONNECT tunnels retry any
  # failure; plain HTTP only retries GET and HEAD.
  retries: 2
  # Timeout for connecting to an upstream and completing the CONNECT handshake.
  connect_timeout: 10s
  # Require clients to authenticate. Can also be set with `--auth user:pass`.
  # auth: admin:secret

state:
  # Where state.json and cache.json live.
  # Default: $PROXYGATE_CACHE_DIR, else ~/.cache/proxygate
  # dir: /var/lib/proxygate
