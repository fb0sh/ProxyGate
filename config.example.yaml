# ProxyGate configuration.
#
# Every key is optional: with no config file at all, the server starts with an
# empty pool on 127.0.0.1:8080. Durations accept `30s`, `10m`, `2h`, `1d`,
# `250ms`, `1h30m` or plain seconds.

server:
  # The one port ProxyGate listens on: the HTTP proxy gateway and the REST API
  # share it. They never collide because the request shapes differ — a proxy
  # request is `CONNECT host:port` or an absolute-form `GET http://host/path`,
  # an API call is an origin-form `/api/v1/...`.
  #
  # `gateway.auth` below protects proxy requests only, so the API on this port
  # stays open. Keep it on the loopback address unless you mean to expose the
  # pool itself.
  listen: 127.0.0.1:8080
  # listen: 0.0.0.0:8080

subscribers:
  # A subscriber is a Lua script plus its parameters. The scripts live in
  # `subscribers/` — one file per source, which beats editing Lua inside YAML —
  # and a relative `lua_file` is resolved against the **directory of this config
  # file**, so keeping `config.yaml` next to `subscribers/` is enough.
  #
  # The contract: the script decides where to fetch, how to page and how to
  # reshape, and finally **returns a list of proxy tables** — one per proxy:
  #
  #   { type = "http" | "socks5" | "socks5h", ip = "1.2.3.4", port = 8080, auth = "user:pass" }
  #
  # `auth` is optional. `socks4` (or anything unknown) is dropped, and `socks5`
  # becomes `socks5h` so the proxy resolves names — with poisoned local DNS a
  # locally resolved address would be handed to the proxy as-is.
  #
  # Inside the script:
  #
  #   fetch(url[, headers])       one GET, returns the body as a string; raises on non-2xx
  #   fetch_json(url[, headers])  same, decoded into a Lua table
  #   json_encode(v) / json_decode(s)
  #   sleep(seconds)              pace the next request (a site's rate limit)
  #   log(...) / print(...)       writes to ProxyGate's log; **not** a way to emit proxies
  #
  # The sandbox loads only string/table/math/coroutine: `io`, `os`, `package`
  # and `debug` are absent, and `dofile`/`loadfile`/`load`/`require` are removed,
  # so `fetch` is the only way out. `timeout` bounds the whole script, including
  # `while true do end`. Every refresh builds a fresh Lua state. Any key that is
  # not `name`/`script_name`, `lua_code`, `lua_file`, `timeout`, `limit`,
  # `enabled` or `via` becomes a global in the script — that is how a script gets
  # its parameters.
  #
  # `via` picks how the script reaches the network: `direct` (never use the
  # pool), `pool` (prefer a healthy proxy from our own pool, fall back to direct
  # when the pool is empty) or `fallback` (default: direct first, retry through a
  # pooled proxy if that fails). A pooled fetch tries up to three distinct
  # proxies. Every request already carries a desktop browser's User-Agent.

  # ── Domestic free lists ────────────────────────────────────────────────
  # These come from jhao104/proxy_pool's fetcher/sources/*.py: same sites, same
  # paging and same field parsing, rewritten as Lua that lives in the config.
  # They rate-limit by IP, so the scripts sleep between pages and a failed page
  # logs a line instead of failing the whole run.

  - name: ip89
    timeout: 30s
    max_pages: 3 # 一页 40 条
    delay: 1
    lua_file: subscribers/ip89.lua

  - name: ip3366
    timeout: 30s
    max_pages: 2 # stype=1（国内）/ stype=2（国外）各翻 2 页
    delay: 1
    lua_file: subscribers/ip3366.lua

  - name: kuaidaili
    timeout: 40s
    max_pages: 2 # inha（高匿）与 intr（普通）各翻 2 页
    delay: 1
    lua_file: subscribers/kuaidaili.lua

  - name: goodips
    timeout: 20s
    lua_file: subscribers/goodips.lua

  - name: ihuan
    timeout: 20s
    lua_file: subscribers/ihuan.lua

  - name: daili66
    timeout: 20s
    lua_file: subscribers/daili66.lua

  # ── Overseas lists and JSON APIs ───────────────────────────────────────

  # Roundproxies：海外列表，命中率比国内那几个高，值得多翻几页。
  - name: roundproxies
    timeout: 30s
    per_page: 50
    max_pages: 3
    delay: 1
    lua_file: subscribers/roundproxies.lua

  # SCDN：一页 100 条、几百页，默认只取前 3 页。
  - name: scdn
    timeout: 30s
    per_page: 100
    max_pages: 3
    delay: 1
    lua_file: subscribers/scdn.lua

  # Proxifly：全量 JSON 约 5 MB / 1.8 万条，脚本只挑出 CN + http/https 的那些
  # （实测 346 条）；`wanted_country: ""` 可以放开到全世界。
  - name: proxifly
    timeout: 60s
    wanted_country: CN
    limit: 500
    lua_file: subscribers/proxifly.lua

  # charlespikachu/freeproxy：约 3 MB / 1.8 万条的公开列表，每次刷新都取最新的一份。
  # 脚本直接扫 JSON 文本而不是建表；`limit` 决定交给池子多少条——上万条全塞进去
  # 会让健康探测排很久的队。
  #
  # 这里按原站（GitHub Pages）取，本机实测要 170s 上下；`subscribers/freeproxy.lua`
  # 的默认值是 jsDelivr 上同一个仓库的镜像（5.1s / 3.0 MB），嫌慢就换成：
  #   source_url: https://cdn.jsdelivr.net/gh/charlespikachu/freeproxy@master/proxies.json
  - name: freeproxy
    timeout: 300s
    source_url: https://charlespikachu.github.io/freeproxy/proxies.json
    limit: 500
    lua_file: subscribers/freeproxy.lua

  # ── zdaye: an example of a site behind a WAF ───────────────────────────
  #
  # 这个站点前面挂着阿里云 WAF：实测连着抓十来个请求就被拦成 405，而且会持续
  # 一段时间。所以除了脚本自己控速，这里把出口也换成池子里的健康代理
  # （`via: pool`），被拉黑的就是代理的 IP 而不是你的机器。
  #
  # 国内段 `/free/` 第 1 页没有数字后缀，之后 `/free/2/` … `/free/22/`（实测 421
  # 条）；海外段 `/free_haiwai/` 实测第 118 页还有 9 条。两段共用同一份脚本。
  # 想把 22 页全抓完就得调大 `max_pages`，但那基本一定会被拦。
  - name: zdaye
    timeout: 120s
    via: pool
    base_url: https://www.zdaye.com/free/
    max_pages: 3
    delay: 2
    lua_file: subscribers/zdaye.lua

  - name: zdaye-overseas
    timeout: 120s
    via: pool
    base_url: https://www.zdaye.com/free_haiwai/
    max_pages: 3
    delay: 2
    lua_file: subscribers/zdaye.lua

  # ── Other shapes ───────────────────────────────────────────────────────
  #
  # A script can also be inlined (`lua_code` and `lua_file` are mutually
  # exclusive), which suits a five-line source:
  #
  # - name: inline
  #   timeout: 20s
  #   target_url: https://api.example.com/data.json   # extra keys -> globals
  #   lua_code: |
  #     local body = fetch_json(target_url)
  #     local result = {}
  #     for _, row in ipairs(body.data or {}) do
  #       table.insert(result, { type = "http", ip = row.ip, port = tonumber(row.port) })
  #     end
  #     return result

refresh:
  # How long a fetched subscriber result is reused before running the script
  # again — i.e. how often new proxies are pulled in.
  interval: 10m
  # Per-subscriber timeout, when the subscriber does not set its own.
  timeout: 20s
  # Restock early when the pool runs dry, instead of waiting for `interval` to
  # come around: free proxies are a "used up as you go" resource, and the regular
  # tick cannot cover the gap in between. This is jhao104/proxy_pool's
  # `POOL_SIZE_MIN`, expressed as a low-water mark on the *alive* count.
  #
  # `cooldown` is what keeps this from turning your sources into a polling
  # target (free lists are chronically below the mark): two early refreshes are
  # at least this far apart. Worst case, source traffic is `interval / cooldown`
  # times the normal rate — 5x with the values below.
  #
  # Drop the whole block, or set `min_alive: 0`, to turn it off.
  low_water:
    min_alive: 20
    cooldown: 2m

health:
  # Every target is fetched *through each proxy*, concurrently. A proxy is only
  # usable if the probe succeeds, so these are the questions you are asking:
  # one international endpoint (proves the tunnel actually leaves the country)
  # and one domestic one (proves it is not simply broken for everything else).
  #
  # `require: any` (default) accepts a proxy that reaches at least one of them,
  # which keeps the pool usable on networks where one target is hard to reach.
  # Switch to `all` to hand out only proxies that reach everything you need.
  targets:
    - https://www.google.com/generate_204
    - https://cn.bing.com/
  require: any

  # Cheaper/faster alternatives if Google is a poor fit for you:
  #   - https://cp.cloudflare.com/generate_204      (global anycast, 204)
  #   - http://connect.rom.miui.com/generate_204    (domestic, very fast)
  # `target: <url>` (singular) is still accepted as an alias for a one-entry list.
  #
  # NOT the same knob as `refresh.interval`: that one decides how often the
  # subscriber scripts run and pull in new proxies, this one decides how often
  # the *existing* pool is probed again. Re-probing several thousand proxies
  # every 30s is too often, and the log fills with TLS errors; 5m is a good
  # middle ground between noticing a proxy that just died and doing nothing.
  interval: 5m
  # Per-proxy request timeout. Free proxies are mostly dead connections, and 3s
  # is enough to tell; waiting 5s only makes the whole pass slower.
  timeout: 3s
  # Maximum number of proxies probed at the same time — the single knob that
  # decides how long the first check takes. On a measured 1,020-proxy pool
  # against the real targets, 300 in flight finished in 14s and 100 in 30s (the
  # gap depends on how quickly dead proxies fail, not only on the parallelism).
  # A source that returns tens of thousands of entries should get a `limit` for
  # the same reason.
  concurrency: 300
  # Consecutive failures after which a proxy that was working is considered
  # dead. A proxy that never answered is dead after its first failure.
  max_failures: 3
  # A failing proxy is retried with exponential backoff: after the first failure
  # come 10s, 20s, 40s ... up to `backoff_max`, while a *working* proxy is
  # re-probed every `health.interval`. Free pools are ~99% dead, so retrying them
  # at the healthy cadence is pure waste — one measured pool had 9 working out of
  # 1,019. `backoff_max` is also the worst case for noticing that a dead proxy
  # came back, so keep it within the outage you can tolerate.
  backoff_base: 5s
  backoff_max: 30m

selection:
  # random (spread the load), latency (prefer the fastest probe), or score
  # (sample a few candidates and take the best mix of latency, failure count and
  # how long ago it was last used).
  strategy: random
  # How many candidates `strategy: score` looks at. 0 scores every candidate.
  sample_size: 32
  # Prefer proxies that were not handed out within this window.
  reuse_after: 30m
  # Probe the chosen proxy before handing it out, so `/api/v1/get` returns one
  # that just passed instead of one whose verdict may be hours old.
  verify: true
  # Skip that probe when the cached verdict is newer than this. `0s` probes
  # every time (the safest and, in a one-client setup, perfectly affordable).
  max_age: 60s
  # Timeout for probing a single candidate while handing out. Shorter than
  # `health.timeout` on purpose: better to try the next candidate quickly.
  verify_timeout: 3s
  # Candidates to try when a verification fails before giving up.
  verify_attempts: 3

gateway:
  # Extra upstream attempts after the first one fails. CONNECT tunnels retry any
  # failure; plain HTTP only retries GET and HEAD.
  retries: 2
  # Timeout for connecting to an upstream and completing the CONNECT handshake.
  connect_timeout: 10s
  # No client authentication: this file assumes the gateway stays reachable only
  # from this machine. Set `auth: user:password` to require credentials from
  # gateway clients — the REST API on the same port stays open either way,
  # because it is not a proxy request.

state:
  # Where state.json and cache.json live.
  # Default: $PROXYGATE_CACHE_DIR, else ~/.cache/proxygate
  #
  # A relative `dir` is relative to the *working directory*, not to this file
  # (`lua_file` above is the other way around, because a config that ships with
  # its scripts means "next to me").
  # dir: /var/lib/proxygate
