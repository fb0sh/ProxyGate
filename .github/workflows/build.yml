name: build

# Builds and tests the three platforms ProxyGate ships binaries for:
#   * Linux amd64   (x86_64-unknown-linux-gnu)
#   * macOS arm64   (aarch64-apple-darwin)
#   * Windows amd64 (x86_64-pc-windows-msvc)
#
# Nothing else: no Windows arm64, no Linux arm64, no other macOS targets.
#
# On a `v*` tag the same archives are published as a GitHub Release, which is
# the download path for people who do not want to build it themselves; on
# branches they are only attached to the workflow run.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full backtraces when a test fails on a runner nobody is watching.
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform even if one of them breaks.
      fail-fast: false
      matrix:
        include:
          # GitHub's ubuntu runners are x86_64, macos-14 runners are Apple
          # silicon and windows runners are x86_64: every build is native, no
          # cross-compilation.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The builds are meant to be native. If the runner label ever changes
      # architecture this fails loudly instead of silently cross-compiling.
      # `macos-14` is Apple silicon; the confusing part of GitHub's naming is
      # that `*-large` is the Intel variant for macOS 14 and newer.
      - name: Assert the runner matches the target
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "runner host: $host"
          echo "target:      ${{ matrix.target }}"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::This runner is $host, but the job must build ${{ matrix.target }} natively. Pick a runner label with that architecture."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Debug build on purpose: it also enables the overflow checks that release
      # builds turn off, and the suite (fake upstreams, no network) takes ~1s.
      # Windows is not a second-class target here: the only tests skipped there
      # are the ones that need a POSIX shell.
      #
      # `--no-fail-fast` reports every failing binary in one run, and the failing
      # test names are emitted as annotations: downloading a job log needs admin
      # rights, annotations are public, so this is what makes a red cross
      # diagnosable from outside the repository.
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --locked --no-fail-fast 2>&1 | tee test-output.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            grep -E '^---- .* stdout ----$' test-output.log \
              | sed -E 's/^---- (.*) stdout ----$/\1/' \
              | sort -u \
              | while read -r name; do echo "::error::failing test: $name"; done
            grep -E 'panicked at|^assertion|^  left:|^  right:' test-output.log \
              | head -20 \
              | while read -r line; do echo "::error::$line"; done
          fi
          exit "$status"

      # The API reference is published to docs.rs and is written in Chinese, so
      # a broken intra-doc link or an undocumented public item fails the build
      # here rather than showing up as a warning nobody reads.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Smoke test
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/proxygate"
          if [ ! -f "$bin" ]; then bin="$bin.exe"; fi
          "$bin" --version

      # Running the binary already proves it is the right architecture (a
      # foreign-arch executable cannot start); these steps additionally read the
      # header so a mistake is reported as "wrong arch" instead of a vague
      # failure somewhere else.
      - name: Verify the binary architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/proxygate.exe"
          $bytes = [IO.File]::ReadAllBytes($bin)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          "PE machine = 0x{0:X4}" -f $machine
          if ($machine -ne 0x8664) {
            throw ("expected an x86-64 (0x8664) executable, got 0x{0:X4}" -f $machine)
          }

      - name: Verify the binary architecture (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/proxygate"
          case "${{ matrix.target }}" in
            *apple-darwin)
              lipo -archs "$bin"
              lipo -archs "$bin" | grep -qw arm64
              ;;
            *linux-gnu)
              file "$bin"
              file "$bin" | grep -q 'x86-64'
              ;;
          esac

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="proxygate-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/proxygate" "dist/${name}/"
          cp README.md README.en.md SKILL.md LICENSE config.example.yaml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "packaged dist/${name}.tar.gz"
          tar -tzf "dist/${name}.tar.gz"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          $name = "proxygate-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/proxygate.exe" "dist/$name/"
          Copy-Item README.md, README.en.md, SKILL.md, LICENSE, config.example.yaml "dist/$name/"
          # Same layout as the tar.gz archives: one top-level directory.
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          Write-Host "packaged dist/$name.zip"
          Get-ChildItem "dist/$name" | Select-Object Name, Length

      # Only the archives: `dist/*` would also upload the unpacked directory the
      # packaging step created, which doubles the artifact and — worse — makes
      # `gh release create dist/*` try to upload a directory, which fails after
      # the release has already been created (an empty release, no binaries).
      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: proxygate-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # Only a tag publishes: that is what makes the binaries downloadable without
  # cloning and building.
  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml would publish archives whose name
      # and embedded version lie, so refuse before uploading anything.
      - name: The tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag:     $GITHUB_REF_NAME"
          echo "version: $version"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi

      # `merge-multiple` flattens the three artifact directories into dist/.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Fail here with a readable annotation rather than inside `gh`, where the
      # release would already exist and the reason would be buried in a log
      # nobody can download.
      - name: Check the archives are here
        shell: bash
        run: |
          ls -l dist
          found=$(ls dist/*.tar.gz dist/*.zip 2>/dev/null | wc -l)
          echo "archives found: $found"
          if [ "$found" -ne 3 ]; then
            echo "::error::expected 3 archives (one per platform), found $found"
            exit 1
          fi

      # Idempotent on purpose: re-running a tag (or re-pushing it after a failed
      # upload) uploads into the existing release instead of failing because it
      # is already there.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/*.zip)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; uploading into it"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              "${files[@]}"
          fi
